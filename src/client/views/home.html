<section id="home" class="page active">
  <div class="eyebrow">VIVA · SEU TEMPO, SEU RITMO</div>
  <h1>O que você quer<br />fazer agora?</h1>
  <p class="home-intro">Escolha um caminho para o seu momento.</p>
  <button
    class="btn ghost"
    style="width: 100%; margin: 0 0 22px"
    onclick="go('about')"
  >
    Sobre o app e como funciona
  </button>
  <div class="options">
    <button
      class="option option-move"
      onclick="recommended=false;go('activities')"
    >
      <span class="option-num">01 / MOVIMENTE-SE</span>
      <div class="option-icon">↗</div>
      <h2>Encontrar uma atividade</h2>
      <p>
        Corrida, bike, caminhada e novas ideias.<br />Escolha pelo seu ânimo e
        tempo disponível.
      </p>
      <span class="option-link">Explorar atividades <b>→</b></span></button
    ><button class="option" onclick="go('nature')">
      <span class="option-num">02 / OLHARES CURIOSOS</span>
      <div class="option-icon">❋</div>
      <h2>Olhar curioso</h2>
      <p>Fotografe algo que chamou sua atenção.<br />Descubra mais no seu ritmo.</p>
      <span class="option-link">Explorar Olhar curioso <b>→</b></span></button
    ><button class="option" onclick="go('exercises')">
      <span class="option-num">03 / EXERCÍCIOS LIVRES</span>
      <div class="option-icon">▷</div>
      <h2>Aprender um exercício</h2>
      <p>Treinos por séries e repetições.<br />Alongamentos por tempo.</p>
      <span class="option-link">Ver exercícios <b>→</b></span></button
    ><button class="option" onclick="go('walk')">
      <span class="option-num">04 / CAMINHADA E PARQUES</span>
      <div class="option-icon">⌖</div>
      <h2>Onde ficam os parques</h2>
      <p>
        Localização de parques em Manaus.<br />Pesquise pelo nome ou bairro.
      </p>
      <span class="option-link">Ver parques <b>→</b></span></button
    ><button class="option" onclick="go('events')">
      <span class="option-num">05 / EVENTOS EM MANAUS</span>
      <div class="option-icon">◎</div>
      <h2>Encontrar minha turma</h2>
      <p>
        Esportes e atividades em grupo.<br />Veja os encontros publicados pela
        equipe.
      </p>
      <span class="option-link">Explorar eventos <b>→</b></span></button
    ><button class="option" onclick="go('routine')">
      <span class="option-num">06 / BEM-ESTAR</span>
      <div class="option-icon">⌁</div>
      <h2>Cuidar do meu ritmo</h2>
      <p>
        Observe seu sono, seus objetivos<br />e as atividades que fazem bem para
        você.
      </p>
      <span class="option-link">Ver minha rotina <b>→</b></span>
    </button>
  </div>
</section>
