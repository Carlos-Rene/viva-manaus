<section id="devlogin" class="page">
  <button class="chip" onclick="go('home')">← Voltar ao app</button>
  <div class="eyebrow">Área da equipe</div>
  <h1>Login de desenvolvedor</h1>
  <p>Informe a senha de desenvolvedor para gerenciar o conteúdo do Viva.</p>
  <div class="box">
    <form id="developerLoginForm" onsubmit="loginDeveloper(event)">
      <label for="devLoginPassword">Senha de desenvolvedor</label>
      <input
        id="devLoginPassword"
        type="password"
        autocomplete="current-password"
        required
        maxlength="1024"
        placeholder="Digite sua senha"
      />
      <p id="devLoginStatus" role="status" aria-live="polite">
        O acesso é verificado com segurança pelo servidor.
      </p>
      <button class="btn login-anchor" type="submit">Entrar</button>
    </form>
    <button
      id="devLoginContinue"
      class="btn ghost hidden"
      onclick="setProfile('developer')"
    >
      Entrar no painel
    </button>
    <button
      id="devLogoutButton"
      class="text-link hidden"
      type="button"
      onclick="logoutDeveloper()"
    >
      Sair da conta de desenvolvedor
    </button>
  </div>
  <p class="sub">
    A senha nunca é salva neste navegador. O acesso ao painel e às alterações
    do catálogo depende da confirmação do servidor.
  </p>
</section>
